<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Suma</title>
</head>
<body>
  <h2>Calculadora de Suma</h2>

  <input type="number" id="num1" placeholder="Primer número">
  <span>+</span>
  <input type="number" id="num2" placeholder="Segundo número">
  <button onclick="sumar()">Sumar</button>

  <p id="resultado">Resultado: 0</p>

  <script>
    function sumar() {
      const n1 = Number(document.getElementById("num1").value);
      const n2 = Number(document.getElementById("num2").value);
      const total = n1 + n2;

      document.getElementById("resultado").textContent = "Resultado: " + total;
    }
  </script>
</body>
</html>
